<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Notifications — Scholar Junction</title>
<link rel="stylesheet" href="../assets/css/global.css">
<link rel="stylesheet" href="../assets/css/notifications.css">
</head>
<body>
<div class="app-shell">
  <aside class="app-sidebar">
    <div class="sidebar-brand">
      <div class="sj-logo-box" style="width:38px;height:38px"><img src="../assets/img/logo.png"></div>
      <b>Scholar Junction</b>
    </div>
    <nav class="sidebar-nav">
      <a href="dashboard.html">📊 Dashboard</a>
      <a href="notifications.html" class="active">🔔 Notifications</a>
      <a href="messages.html">💬 Messages</a>
      <a href="settings.html">⚙️ Settings</a>
    </nav>
  </aside>

  <div class="app-main">
    <div class="app-topbar">
      <div class="breadcrumb">
        <a href="../index.html">Home</a> 
        <span class="sep">/</span> 
        <a href="dashboard.html">Dashboard</a>
        <span class="sep">/</span> 
        <strong>Notifications</strong>
      </div>
      <div style="display:flex;gap:8px;align-items:center;">
        <button class="btn btn-outline btn-sm" onclick="markAllRead()">✅ Mark all read</button>
        <a href="dashboard.html" class="btn btn-outline btn-sm">← Dashboard</a>
        <div class="avatar" id="headerAvatar">AS</div>
      </div>
    </div>

    <div class="app-content" style="max-width:820px;">
      <!-- Notification Stats -->
      <div class="notif-stats">
        <div class="stat-chip"><span>🔔</span> <span id="totalNotifs">0</span> Total</div>
        <div class="stat-chip"><span>📌</span> <span id="unreadNotifs">0</span> Unread</div>
        <div class="stat-chip"><span>✅</span> <span id="readNotifs">0</span> Read</div>
      </div>

      <!-- Filters -->
      <div class="notif-filters">
        <span class="chip active" data-filter="all" onclick="filterNotifications('all')">📋 All</span>
        <span class="chip" data-filter="unread" onclick="filterNotifications('unread')">🔴 Unread</span>
        <span class="chip" data-filter="read" onclick="filterNotifications('read')">✅ Read</span>
        <span class="chip" data-filter="event" onclick="filterNotifications('event')">📅 Events</span>
        <span class="chip" data-filter="social" onclick="filterNotifications('social')">👥 Social</span>
        <span class="chip" data-filter="project" onclick="filterNotifications('project')">🧪 Projects</span>
      </div>

      <!-- Notifications List -->
      <div id="notificationsContainer">
        <!-- Will be populated by JavaScript -->
      </div>
    </div>
  </div>
</div>

<!-- Notification Detail Modal -->
<div class="notif-modal" id="notifModal">
  <div class="modal-overlay" onclick="closeNotifDetail()"></div>
  <div class="modal-content" style="max-width:500px;">
    <button class="modal-close" onclick="closeNotifDetail()">✕</button>
    <div class="modal-body" id="notifDetailBody" style="padding:30px;">
      <!-- Dynamic content -->
    </div>
  </div>
</div>

<!-- Toast Container -->
<div class="toast-container"></div>

<script src="../assets/js/user-db.js"></script>
<script src="../assets/js/app.js"></script>
<script src="../assets/js/notifications.js"></script>
</body>
</html>
