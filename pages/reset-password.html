<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — Scholar Junction</title>
<link rel="stylesheet" href="../assets/css/global.css">
<style>
  * { box-sizing: border-box; }
  body { 
    background: linear-gradient(135deg, #f8faff, #f0f3ff);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Inter', sans-serif;
    padding: 20px;
  }
  .reset-container {
    max-width: 440px;
    width: 100%;
    padding: 40px;
    background: white;
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.08);
    text-align: center;
    animation: fadeInUp 0.6s ease forwards;
  }
  .reset-container .logo {
    font-size: 48px;
    margin-bottom: 12px;
  }
  .reset-container h1 {
    font-family: 'Poppins', sans-serif;
    font-size: 26px;
    color: #0f172a;
    margin-bottom: 6px;
  }
  .reset-container .subtitle {
    color: #64748b;
    font-size: 14px;
    margin-bottom: 24px;
  }
  .reset-container .form-row {
    text-align: left;
    margin-bottom: 16px;
  }
  .reset-container .label {
    font-size: 13px;
    font-weight: 600;
    color: #334155;
    margin-bottom: 6px;
    display: block;
  }
  .reset-container .input-group {
    position: relative;
    display: flex;
    align-items: center;
  }
  .reset-container .input-group .input {
    width: 100%;
    padding: 12px 44px 12px 14px;
    border-radius: 12px;
    border: 1px solid #e2e8f0;
    font-size: 14px;
    outline: none;
    transition: all 0.2s ease;
    background: #fff;
  }
  .reset-container .input-group .input:focus {
    border-color: #2563EB;
    box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
  }
  .reset-container .input-group .input.error {
    border-color: #EF4444;
    box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.1);
  }
  .reset-container .password-toggle {
    position: absolute;
    right: 12px;
    background: none;
    border: none;
    cursor: pointer;
    font-size: 18px;
    color: #94a3b8;
    padding: 4px;
    border-radius: 6px;
  }
  .reset-container .password-toggle:hover {
    background: #f1f5f9;
    color: #0f172a;
  }
  .reset-container .password-strength {
    margin-top: 8px;
  }
  .reset-container .strength-bar {
    height: 4px;
    background: #e2e8f0;
    border-radius: 2px;
    overflow: hidden;
  }
  .reset-container .strength-fill {
    height: 100%;
    width: 0%;
    border-radius: 2px;
    transition: width 0.3s ease;
  }
  .reset-container .strength-text {
    font-size: 12px;
    color: #94a3b8;
    margin-top: 4px;
  }
  .reset-container .btn {
    width: 100%;
    padding: 12px 20px;
    border-radius: 16px;
    border: none;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.2s ease;
    background: linear-gradient(135deg, #2563EB, #7C3AED);
    color: white;
    box-shadow: 0 8px 20px rgba(37, 99, 235, 0.22);
    margin-top: 4px;
  }
  .reset-container .btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 28px rgba(37, 99, 235, 0.28);
  }
  .reset-container .btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
  }
  .reset-container .btn.loading {
    position: relative;
    color: transparent;
  }
  .reset-container .btn.loading::after {
    content: '';
    position: absolute;
    width: 20px;
    height: 20px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: white;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  .reset-container .back-link {
    display: inline-block;
    margin-top: 16px;
    color: #2563EB;
    text-decoration: none;
    font-size: 14px;
  }
  .reset-container .back-link:hover {
    text-decoration: underline;
  }
  .reset-container .error-message {
    color: #EF4444;
    font-size: 13px;
    margin-top: 8px;
    display: none;
  }
  .reset-container .success-message {
    color: #22C55E;
    font-size: 13px;
    margin-top: 8px;
    display: none;
  }
  .reset-container .token-status {
    padding: 12px 16px;
    border-radius: 12px;
    margin-bottom: 16px;
    font-size: 14px;
    display: none;
  }
  .reset-container .token-status.valid {
    background: #ecfdf5;
    color: #059669;
    border: 1px solid #bbf7d0;
    display: block;
  }
  .reset-container .token-status.invalid {
    background: #fef2f2;
    color: #dc2626;
    border: 1px solid #fecaca;
    display: block;
  }
  .reset-container .token-status .status-icon {
    font-size: 20px;
    margin-right: 8px;
  }
  @keyframes fadeInUp {
    from {
      opacity: 0;
      transform: translateY(20px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }
  @media (max-width: 480px) {
    .reset-container {
      padding: 24px;
      margin: 0 8px;
    }
    .reset-container h1 {
      font-size: 22px;
    }
  }
</style>
</head>
<body>

<div class="reset-container" id="resetContainer">
  <div class="logo">🔐</div>
  <h1>Reset Password</h1>
  <p class="subtitle" id="subtitle">Enter your new password below</p>

  <!-- Token Status -->
  <div id="tokenStatus" class="token-status">
    <span class="status-icon">✅</span>
    <span id="tokenStatusText">Token verified! Enter your new password.</span>
  </div>

  <!-- Reset Form -->
  <form id="resetForm" onsubmit="handleReset(event)">
    <div class="form-row">
      <label class="label">New Password</label>
      <div class="input-group">
        <input class="input" type="password" id="newPassword" placeholder="Enter new password" required>
        <button type="button" class="password-toggle" onclick="togglePasswordVisibility('newPassword')">👁️</button>
      </div>
      <div class="password-strength">
        <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
        <span class="strength-text" id="strengthText">Enter a password</span>
      </div>
    </div>

    <div class="form-row">
      <label class="label">Confirm Password</label>
      <div class="input-group">
        <input class="input" type="password" id="confirmPassword" placeholder="Confirm new password" required>
        <button type="button" class="password-toggle" onclick="togglePasswordVisibility('confirmPassword')">👁️</button>
      </div>
    </div>

    <div id="errorMessage" class="error-message"></div>
    <div id="successMessage" class="success-message"></div>

    <button type="submit" class="btn" id="resetBtn">Reset Password →</button>
  </form>

  <a href="login.html" class="back-link">← Back to Login</a>
</div>

<script src="../assets/js/user-db.js"></script>
<script>
// ============================================
// RESET PASSWORD - COMPLETE
// ============================================

document.addEventListener('DOMContentLoaded', function() {
  console.log('🔑 Reset Password Page Loading...');
  
  // Get token from URL
  const urlParams = new URLSearchParams(window.location.search);
  const token = urlParams.get('token');
  const email = urlParams.get('email');
  
  console.log('🔑 Token:', token);
  console.log('📧 Email:', email);
  
  if (token && email) {
    validateToken(token, email);
  } else {
    // Try to get from localStorage
    const savedEmail = localStorage.getItem('resetEmail');
    if (savedEmail) {
      document.getElementById('subtitle').textContent = 
        `Enter your new password for ${savedEmail}`;
      showTokenStatus('valid', `✅ Verified! Reset password for ${savedEmail}`);
    } else {
      showTokenStatus('invalid', '❌ Invalid or missing reset token. Please request a new password reset.');
      document.getElementById('resetBtn').disabled = true;
      document.getElementById('resetBtn').style.opacity = '0.5';
    }
  }
  
  // Setup password strength
  const newPassword = document.getElementById('newPassword');
  if (newPassword) {
    newPassword.addEventListener('input', checkPasswordStrength);
  }
  
  console.log('🔑 Reset Password Page Ready!');
});

// ============================================
// VALIDATE TOKEN
// ============================================

function validateToken(token, email) {
  console.log('🔍 Validating token for:', email);
  
  const user = UserDB.findByEmail(email);
  if (!user) {
    showTokenStatus('invalid', '❌ No account found with this email address.');
    document.getElementById('resetBtn').disabled = true;
    document.getElementById('resetBtn').style.opacity = '0.5';
    return;
  }
  
  // Check if token exists and is valid
  if (!user.resetToken || user.resetToken !== token) {
    showTokenStatus('invalid', '❌ Invalid reset token. Please request a new password reset.');
    document.getElementById('resetBtn').disabled = true;
    document.getElementById('resetBtn').style.opacity = '0.5';
    return;
  }
  
  // Check if token is expired (1 hour)
  if (user.resetTokenExpiry) {
    const expiry = new Date(user.resetTokenExpiry);
    if (expiry < new Date()) {
      showTokenStatus('invalid', '❌ Reset token has expired. Please request a new password reset.');
      document.getElementById('resetBtn').disabled = true;
      document.getElementById('resetBtn').style.opacity = '0.5';
      return;
    }
  }
  
  // Token is valid
  showTokenStatus('valid', `✅ Token verified! Enter your new password for ${email}`);
  document.getElementById('subtitle').textContent = `Reset password for ${email}`;
  
  // Store email in form
  document.getElementById('resetForm').dataset.email = email;
  document.getElementById('resetBtn').disabled = false;
  document.getElementById('resetBtn').style.opacity = '1';
}

// ============================================
// SHOW TOKEN STATUS
// ============================================

function showTokenStatus(type, message) {
  const statusEl = document.getElementById('tokenStatus');
  const textEl = document.getElementById('tokenStatusText');
  
  statusEl.className = `token-status ${type}`;
  textEl.textContent = message;
  statusEl.style.display = 'block';
}

// ============================================
// HANDLE RESET SUBMIT
// ============================================

function handleReset(event) {
  event.preventDefault();
  
  const email = document.getElementById('resetForm').dataset.email;
  const newPassword = document.getElementById('newPassword').value;
  const confirmPassword = document.getElementById('confirmPassword').value;
  const btn = document.getElementById('resetBtn');
  const errorEl = document.getElementById('errorMessage');
  const successEl = document.getElementById('successMessage');
  
  // Reset messages
  errorEl.style.display = 'none';
  successEl.style.display = 'none';
  
  // Validate
  if (!email) {
    showError('Email not found. Please request a new password reset.');
    return;
  }
  
  if (newPassword.length < 6) {
    showError('Password must be at least 6 characters.');
    return;
  }
  
  if (newPassword !== confirmPassword) {
    showError('Passwords do not match.');
    return;
  }
  
  // Show loading
  btn.classList.add('loading');
  btn.disabled = true;
  
  setTimeout(() => {
    const user = UserDB.findByEmail(email);
    
    if (!user) {
      showError('User not found. Please request a new password reset.');
      btn.classList.remove('loading');
      btn.disabled = false;
      return;
    }
    
    // Update password
    user.password = UserDB.hashPassword(newPassword);
    user.resetToken = null;
    user.resetTokenExpiry = null;
    UserDB.saveUsers();
    
    // Clear reset data
    localStorage.removeItem('resetEmail');
    localStorage.removeItem('resetToken');
    
    btn.classList.remove('loading');
    btn.disabled = false;
    
    // Show success
    successEl.style.display = 'block';
    successEl.textContent = '✅ Password reset successfully! Redirecting to login...';
    
    // Clear form
    document.getElementById('newPassword').value = '';
    document.getElementById('confirmPassword').value = '';
    document.getElementById('strengthFill').style.width = '0%';
    document.getElementById('strengthText').textContent = 'Enter a password';
    
    setTimeout(() => {
      window.location.href = 'login.html';
    }, 2500);
  }, 1500);
}

// ============================================
// SHOW ERROR
// ============================================

function showError(message) {
  const errorEl = document.getElementById('errorMessage');
  errorEl.textContent = '❌ ' + message;
  errorEl.style.display = 'block';
}

// ============================================
// PASSWORD TOGGLE
// ============================================

function togglePasswordVisibility(inputId) {
  const input = document.getElementById(inputId);
  if (!input) return;
  
  if (input.type === 'password') {
    input.type = 'text';
    const btn = input.closest('.input-group').querySelector('.password-toggle');
    if (btn) btn.textContent = '🙈';
  } else {
    input.type = 'password';
    const btn = input.closest('.input-group').querySelector('.password-toggle');
    if (btn) btn.textContent = '👁️';
  }
}

// ============================================
// PASSWORD STRENGTH
// ============================================

function checkPasswordStrength() {
  const password = document.getElementById('newPassword').value;
  const fill = document.getElementById('strengthFill');
  const text = document.getElementById('strengthText');
  
  if (!fill || !text) return;
  
  const strength = calculateStrength(password);
  const colors = ['#EF4444', '#F59E0B', '#22C55E'];
  const labels = ['Weak', 'Medium', 'Strong'];
  
  fill.style.width = strength === -1 ? '0%' : `${(strength + 1) * 33.33}%`;
  fill.style.background = strength === -1 ? '#e2e8f0' : colors[strength] || '#EF4444';
  text.textContent = strength === -1 ? 'Enter a password' : `Password strength: ${labels[strength] || 'Weak'}`;
  text.style.color = strength === -1 ? '#94a3b8' : colors[strength] || '#EF4444';
}

function calculateStrength(password) {
  if (password.length === 0) return -1;
  
  let score = 0;
  if (password.length >= 8) score++;
  if (password.length >= 12) score++;
  if (/[a-z]/.test(password) && /[A-Z]/.test(password)) score++;
  if (/\d/.test(password)) score++;
  if (/[^a-zA-Z0-9]/.test(password)) score++;
  
  if (score <= 2) return 0;
  if (score <= 4) return 1;
  return 2;
}

console.log('🔑 Reset Password Ready!');
</script>
</body>
</html>
