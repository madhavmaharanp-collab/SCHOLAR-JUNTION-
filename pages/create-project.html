<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Create Project — Scholar Junction</title>
<link rel="stylesheet" href="../assets/css/global.css"><link rel="stylesheet" href="../assets/css/create-project.css"></head><body>
<header class="sj-header"><div class="container-wide sj-header-inner"><a class="sj-brand" href="../index.html"><div class="sj-logo-box"><img src="../assets/img/logo.png"></div><span>Scholar Junction</span></a><div><a href="projects.html" class="btn btn-ghost btn-sm">← Showcase</a><button class="btn btn-primary btn-sm">Publish</button></div></div></header>
<div style="max-width:900px;margin:28px auto;padding:0 24px;">
<h1 class="font-display text-3xl mb-4">Create Project</h1>
<div class="card">
<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">
<div class="form-row"><label class="label">Project Name</label><input class="input" placeholder="ScholarGraph"></div>
<div class="form-row"><label class="label">Technology</label><input class="input" placeholder="TypeScript, Python, Qdrant"></div>
<div class="form-row" style="grid-column:span 2;"><label class="label">Description</label><textarea class="textarea" rows="4" placeholder="What does your project do?"></textarea></div>
<div class="form-row"><label class="label">GitHub</label><input class="input" placeholder="https://github.com/..."></div>
<div class="form-row"><label class="label">Live Demo</label><input class="input" placeholder="https://demo..."></div>
<div class="form-row"><label class="label">Project Image</label><input class="input" type="file"></div>
<div class="form-row"><label class="label">Status</label><select class="select"><option>Active</option><option>Beta</option><option>Archived</option></select></div>
<div class="form-row"><label class="label">Team Members</label><input class="input" placeholder="Add by email / @username"></div>
<div class="form-row"><label class="label">Looking For</label><input class="input" placeholder="Frontend Dev, ML Researcher…"></div>
</div>
<div class="mt-4"><button class="btn btn-primary">Publish to Showcase</button> <button class="btn btn-outline">Save Draft</button></div>
</div>
</div>
<script src="../assets/js/app.js"></script>
<script src="../assets/js/create-project.js"></script>
</body></html>
