<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Create Event — Scholar Junction</title>
<link rel="stylesheet" href="../assets/css/global.css"><link rel="stylesheet" href="../assets/css/create-event.css"></head><body>
<header class="sj-header"><div class="container-wide sj-header-inner"><a class="sj-brand" href="../index.html"><div class="sj-logo-box"><img src="../assets/img/logo.png"></div><span>Scholar Junction</span></a><div class="sj-header-actions"><a href="events.html" class="btn btn-ghost btn-sm">← Events</a><button class="btn btn-primary btn-sm">Publish Event</button></div></div></header>
<div style="max-width:900px;margin:28px auto;padding:0 24px;">
<h1 class="font-display text-3xl mb-4">Create Event</h1>
<div class="card">
<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">
<div class="form-row" style="grid-column:span 2;"><label class="label">Title</label><input class="input" placeholder="Global AI Research Summit 2026"></div>
<div class="form-row" style="grid-column:span 2;"><label class="label">Description</label><textarea class="textarea" rows="4" placeholder="Event details…"></textarea></div>
<div class="form-row"><label class="label">Category</label><select class="select"><option>Conference</option><option>Workshop</option><option>Hackathon</option><option>Seminar</option></select></div>
<div class="form-row"><label class="label">Visibility</label><select class="select"><option>Public</option><option>Private</option><option>Invite only</option></select></div>
<div class="form-row"><label class="label">Date</label><input class="input" type="date" value="2026-07-24"></div>
<div class="form-row"><label class="label">Time</label><input class="input" type="time" value="19:15"></div>
<div class="form-row"><label class="label">Location</label><input class="input" placeholder="Online / Kathmandu"></div>
<div class="form-row"><label class="label">Online Link</label><input class="input" placeholder="https://meet.scholarjunction.app/..."></div>
<div class="form-row"><label class="label">Banner Upload</label><input class="input" type="file"></div>
<div class="form-row"><label class="label">Video Upload</label><input class="input" type="file"></div>
<div class="form-row"><label class="label">Maximum Participants</label><input class="input" type="number" value="1500"></div>
<div class="form-row"><label class="label">Countdown Timer</label><select class="select"><option>Enabled</option><option>Disabled</option></select></div>
</div>
<div class="mt-4" style="display:flex;gap:10px;"><button class="btn btn-primary">Publish Event</button><button class="btn btn-outline">Save Draft</button></div>
</div>
</div>
<script src="../assets/js/app.js"></script>
<script src="../assets/js/create-event.js"></script>
</body></html>
